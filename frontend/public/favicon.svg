<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="road" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#374151"/>
      <stop offset="100%" style="stop-color:#4B5563"/>
    </linearGradient>
  </defs>
  <!-- Road -->
  <rect x="5" y="40" width="90" height="30" rx="5" fill="url(#road)"/>
  <!-- Road lines -->
  <rect x="15" y="53" width="15" height="4" fill="#FCD34D"/>
  <rect x="42" y="53" width="15" height="4" fill="#FCD34D"/>
  <rect x="70" y="53" width="15" height="4" fill="#FCD34D"/>
  <!-- Car body -->
  <rect x="55" y="35" width="30" height="15" rx="3" fill="#EF4444"/>
  <rect x="60" y="28" width="18" height="10" rx="2" fill="#EF4444"/>
  <!-- Car windows -->
  <rect x="62" y="30" width="14" height="6" rx="1" fill="#93C5FD"/>
  <!-- Car wheels -->
  <circle cx="62" cy="52" r="6" fill="#1F2937"/>
  <circle cx="78" cy="52" r="6" fill="#1F2937"/>
  <circle cx="62" cy="52" r="3" fill="#6B7280"/>
  <circle cx="78" cy="52" r="3" fill="#6B7280"/>
  <!-- Keyboard key -->
  <rect x="10" y="15" width="25" height="20" rx="3" fill="#3B82F6"/>
  <text x="22" y="29" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">A</text>
</svg>
